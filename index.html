<style>
/* Layout: uma coluna estreita (até 760px), resumo escuro no topo do treino, o resto recolhido; abas fixas embaixo no celular */
:root {
  --bg: #F2EEE6; --surface: #FBF9F4; --surface-2: #EFEAE0; --ink: #14181F; --ink-2: #474C55; --muted: #676C75;
  --line: #DDD6C8; --grid: #E7E1D5; --axis: #C9C2B3;
  --accent: #F28C4A; --accent-ink: #B9470F; --accent-soft: rgba(242,140,74,.14); --on-accent: #14181F;
  --hero: #14181F; --hero-2: #252C38; --hero-ink: #F2EEE6; --hero-muted: #B4BBC6;
  --z0: #C9C3B6; --z1: #E0A25E; --z2: #DA8142; --z3: #C9612A; --z4: #A8461C; --z5: #7E2D12;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --good: #1C7C3A; --bad: #B3261E;
  --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1217; --surface: #171C23; --surface-2: #1E242D; --ink: #F2EEE6; --ink-2: #C3C8D0; --muted: #959BA5;
    --line: #2A313C; --grid: #232A34; --axis: #3A424E;
    --accent: #F28C4A; --accent-ink: #F5A673; --accent-soft: rgba(242,140,74,.16); --on-accent: #14181F;
    --hero: #1F2630; --hero-2: #2A3240; --hero-ink: #F2EEE6; --hero-muted: #B4BBC6;
    --z0: #4A515C; --z1: #F2B582; --z2: #EE9255; --z3: #E1702F; --z4: #BE5020; --z5: #A23C16;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --good: #4CC27A; --bad: #F2766B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #171C23; --surface-2: #1E242D; --ink: #F2EEE6; --ink-2: #C3C8D0; --muted: #959BA5;
  --line: #2A313C; --grid: #232A34; --axis: #3A424E;
  --accent: #F28C4A; --accent-ink: #F5A673; --accent-soft: rgba(242,140,74,.16); --on-accent: #14181F;
  --hero: #1F2630; --hero-2: #2A3240; --hero-ink: #F2EEE6; --hero-muted: #B4BBC6;
  --z0: #4A515C; --z1: #F2B582; --z2: #EE9255; --z3: #E1702F; --z4: #BE5020; --z5: #A23C16;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --good: #4CC27A; --bad: #F2766B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.app { max-width: 760px; margin: 0 auto; padding-inline: 14px; padding-block: 10px 92px; display: flex; flex-direction: column; gap: 12px; }

/* topo e abas */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.marca svg { width: 26px; height: 26px; flex: none; }
.topo-acoes { display: flex; align-items: center; gap: 8px; }
.abas { display: flex; gap: 2px; }
.aba { flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 11px; font-weight: 600; border-radius: 10px; }
.aba svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.aba[aria-selected="true"] { color: var(--accent-ink); }
@media (max-width: 720px) {
  .abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 721px) {
  .app { padding-block: 16px 48px; }
  .abas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .aba { flex-direction: row; justify-content: center; gap: 6px; font-size: 13px; padding: 8px; }
  .aba svg { width: 17px; height: 17px; }
  .aba[aria-selected="true"] { background: var(--ink); color: var(--bg); }
}
.aba:focus-visible, .btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, .svg-graf:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vista { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.vista.carregando { opacity: .55; transition: opacity .2s; }

/* botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--axis); }
.btn-acento { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-acento:hover { border-color: var(--accent); filter: brightness(1.05); }
.btn-icone { width: 38px; padding: 0; font-size: 18px; }
.btn-link { border: 0; background: none; padding: 4px 0; color: var(--accent-ink); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn-perigo { color: var(--bad); }
.btn-perigo-cheio { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
input[type="number"], input[type="text"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 36px; min-width: 0; font-size: 14px; }
@media (pointer: coarse) { input[type="number"], input[type="text"], select, textarea { font-size: 16px; } }
textarea { width: 100%; resize: vertical; min-height: 72px; }
select { cursor: pointer; }
.campo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.campo > span { font-size: 11px; font-weight: 600; color: var(--muted); }
.form-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.form-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.botoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filtros { display: flex; gap: 8px; }
.filtros select { flex: 1; }

/* cartões */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h2 { font-size: 15px; font-weight: 700; }
h3 { font-size: 13px; font-weight: 700; }
.nota { font-size: 12px; color: var(--muted); }
.texto { color: var(--ink-2); font-size: 13.5px; }
.aviso { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border-radius: 10px; padding: 7px 12px; font-size: 12.5px; }

/* resumo do treino */
.seletor { display: flex; gap: 6px; align-items: center; }
.seletor select { flex: 1; font-weight: 600; }
.resumo { background: var(--hero); color: var(--hero-ink); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.resumo-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.btn-compart { display: inline-flex; align-items: center; gap: 6px; flex: none; border: 0; background: var(--hero-2); color: var(--hero-ink); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn-compart svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.resumo h1 { font-size: 20px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.resumo h1 span { font-weight: 400; color: var(--hero-muted); }
.resumo-sub { font-size: 12.5px; color: var(--hero-muted); margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat b { font-size: 19px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.stat span { font-size: 11px; color: var(--muted); }
.resumo .stat span { color: var(--hero-muted); }
@media (max-width: 350px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* seções recolhidas */
.mais { padding: 0; gap: 0; }
.mais details + details { border-top: 1px solid var(--grid); }
.mais summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 14px; }
.mais summary::-webkit-details-marker { display: none; }
.mais summary small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
.mais summary::after { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -3px 4px 0 0; transition: transform .15s; }
.mais details[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
.mais .conteudo { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* gráficos */
.graf { position: relative; width: 100%; min-width: 0; }
.svg-graf { display: block; max-width: 100%; touch-action: pan-y; }
.t-eixo { fill: var(--muted); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.t-bloco { fill: var(--accent-ink); font: 700 10px var(--sans); }
.t-marca { fill: var(--ink); font: 700 11px var(--sans); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.l-grade { stroke: var(--grid); stroke-width: 1; }
.l-base { stroke: var(--axis); stroke-width: 1; }
.l-cursor { stroke: var(--ink-2); stroke-width: 1; }
.l-marca { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.r-bloco { fill: var(--accent); opacity: .13; }
.r-alvo { fill: transparent; cursor: crosshair; }
.r-coluna { fill: transparent; cursor: pointer; }
.r-coluna:hover { fill: var(--ink); fill-opacity: .05; }
.dica-graf, #dica { position: absolute; z-index: 8; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.14); min-width: 110px; max-width: 240px; }
#dica { position: fixed; white-space: pre-line; }
.dica-tit { font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.dica-lin { display: flex; align-items: center; gap: 6px; }
.dica-lin i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.dica-lin b { font-variant-numeric: tabular-nums; }
.dica-lin span { color: var(--muted); }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 5px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legenda i.lk { height: 3px; width: 14px; border-radius: 2px; }

/* zonas */
.zonas-lista { display: flex; flex-direction: column; gap: 7px; }
.zl { display: grid; grid-template-columns: 76px minmax(0, 1fr) 96px; align-items: center; gap: 8px; font-size: 12.5px; }
.zl-rot b { font-weight: 700; }
.zl-rot small { color: var(--muted); font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.zl-trilho { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.zl-barra { height: 100%; border-radius: 5px; }
.zl-val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.zl-val b { font-weight: 700; }

/* barras empilhadas */
.pilhas { display: flex; flex-direction: column; gap: 8px; }
.pl { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.pl-rot { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font-size: 12.5px; font-weight: 600; line-height: 1.25; min-width: 0; display: flex; gap: 6px; align-items: flex-start; }
.pl-rot small { display: block; font-weight: 400; color: var(--muted); }
.pl-rot i { width: 10px; height: 10px; border-radius: 3px; flex: none; margin-top: 3px; }
.pilha { display: flex; gap: 2px; height: 12px; min-width: 0; border-radius: 4px; overflow: hidden; }
.pilha .seg { min-width: 2px; height: 100%; }
.pl-val { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-2); }
@media (max-width: 520px) { .pl { grid-template-columns: minmax(0, 1fr) auto; } .pl .pilha { grid-column: 1 / -1; grid-row: 2; } }

/* tabelas */
.rolagem { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
.tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tabela th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tabela td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.tabela .num { text-align: right; white-space: nowrap; }
.tabela .dif { display: block; font-size: 11px; color: var(--muted); }
.tabela th .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
.dl { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; margin: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .dl { grid-template-columns: 1fr; gap: 0; } .dl dd { margin-bottom: 6px; } }

/* histórico e comparação */
.lista-treinos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lt { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.lt:last-child { border-bottom: 0; padding-bottom: 0; }
.lt input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.lt-abrir { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.lt-l1 { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.lt-tipo { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lt-data { color: var(--muted); font-size: 12px; white-space: nowrap; }
.lt-metr { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lt .pilha { height: 5px; gap: 1px; }
.chips-cmp { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-cmp { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; background: var(--surface); }
.chip-cmp i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip-cmp button { border: 0; background: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; }
.escolha { display: flex; flex-direction: column; max-height: 260px; overflow: auto; }
.escolha label { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 13px; }
.escolha label:last-child { border-bottom: 0; }
.escolha input { accent-color: var(--accent); width: 17px; height: 17px; flex: none; }
.escolha small { color: var(--muted); margin-left: auto; white-space: nowrap; }
.alternar { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.alternar button { border: 0; background: transparent; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.alternar button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

/* ajustes */
.tz input { width: 72px; }
.tz td { vertical-align: middle; }
.sw-z { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.chave { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.chave input { appearance: none; -webkit-appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--axis); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
.chave input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.chave input:checked { background: var(--accent); }
.chave input:checked::after { transform: translateX(12px); }
.refs { font-size: 12px; color: var(--muted); padding-left: 16px; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.confirmar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }

/* imagem para compartilhar */
.folha-fundo { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,16,.62); display: flex; align-items: flex-end; justify-content: center; }
.folha { background: var(--surface); width: 100%; max-width: 560px; max-height: 100%; overflow: auto; border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 721px) { .folha-fundo { align-items: center; padding: 16px; } .folha { border-radius: 18px; } }
.previa { display: flex; justify-content: center; background: var(--surface-2); border-radius: 12px; padding: 10px; }
.previa canvas { display: block; max-width: 100%; max-height: min(50vh, 520px); width: auto; height: auto; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.22); }
.previa.xadrez { background-color: #2B3038; background-image: linear-gradient(45deg, #3A4049 25%, transparent 25%), linear-gradient(-45deg, #3A4049 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #3A4049 75%), linear-gradient(-45deg, transparent 75%, #3A4049 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
.previa.xadrez canvas { box-shadow: none; }
.segmentado { display: flex; gap: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.segmentado button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 6px 4px; min-height: 34px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.segmentado button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

/* avisos flutuantes */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; width: max-content; max-width: min(92vw, 520px); box-shadow: 0 8px 28px rgba(0,0,0,.25); white-space: pre-line; }

<script>

function parseTCX(txt) {

    if (iD >= 0 && iS >= 0 && linhas[i + 1]) {

      const d = /(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(v[iD] || ''), h = /(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(v[iS] || '');
      if (d && h) base = new Date(+d[3], +d[2] - 1, +d[1], +h[1], +h[2], +(h[3] || 0)).getTime();
      continue;
    }
    const iF = cols.findIndex(c => reFC.test(c)), iT = cols.findIndex(c => reT.test(c));
    if (iF < 0 || iT < 0) continue;
    const brutos = [];
    for (let j = i + 1; j < linhas.length; j++) {
      if (!linhas[j].trim()) continue;
      const v = dividirCSV(linhas[j], sep);
      const fc = parseFloat(String(v[iF] || '').replace(',', '.'));
      const tt = String(v[iT] || '').trim();
      let ms = null, rel = null;
      if (/^\d{4}-\d\d-\d\d/.test(tt)) ms = Date.parse(tt.replace(' ', 'T'));
      else if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(tt)) { const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(tt); if (m) ms = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0)).getTime(); }
      else if (/^\d+:\d{2}(:\d{2})?(\.\d+)?$/.test(tt)) { const ps = tt.split(':').map(parseFloat); rel = ps.length === 3 ? ps[0] * 3600 + ps[1] * 60 + ps[2] : ps[0] * 60 + ps[1]; }
      else if (/^\d+([.,]\d+)?$/.test(tt)) { const n = parseFloat(tt.replace(',', '.')); if (n > 1e11) ms = n; else if (n > 1e9) ms = n * 1000; else rel = n; }
      if (ms == null && rel == null) continue;
      brutos.push({ ms, rel, fc: isFinite(fc) ? fc : null });
    }
    if (!brutos.length) break;
    const ultimoRel = brutos.reduce((m, b) => b.rel != null ? Math.max(m, b.rel) : m, 0);
    const b0 = base ?? (arquivo?.lastModified ? arquivo.lastModified - ultimoRel * 1000 : Date.now());
    const pontos = brutos.map(b => ({ ms: b.ms ?? b0 + b.rel * 1000, fc: b.fc }));
    return [{ formato: 'CSV', esporte: null, voltas: [], pontos, dataAproximada: base == null && brutos.some(b => b.rel != null) }];
  }

}

const ESPORTES = { running: 'Corrida', run: 'Corrida', biking: 'Ciclismo', cycling: 'Ciclismo', bike: 'Ciclismo', walking: 'Caminhada', walk: 'Caminhada', hiking: 'Trilha', swimming: 'Natação', rowing: 'Remo', corrida: 'Corrida', ciclismo: 'Ciclismo', caminhada: 'Caminhada', 'natação': 'Natação' };
const tipoDoEsporte = e => e ? (ESPORTES[String(e).toLowerCase()] || (/^(other|generic|outro|training)$/i.test(e) ? null : (FIT_ESPORTES_NOMES.has(e) ? e : null))) : null;
const FIT_ESPORTES_NOMES = new Set(Object.values(FIT_ESPORTES));
const CANAIS = ['fc', 'alt', 'dist', 'vel', 'cad', 'pot', 'temp', 'lat', 'lon'];

function pesos(t) {
  const n = t.length, dts = [];
  for (let i = 0; i < n - 1; i++) dts.push(t[i + 1] - t[i]);
  const med = dts.length ? mediana(dts) : 1, lim = Math.max(30, med * 5);
  const w = new Array(n);
  let semReg = 0, nPausas = 0, maxDt = 0, minDt = Infinity;
  for (let i = 0; i < n - 1; i++) {
    const d = dts[i];
    if (d > maxDt) maxDt = d; if (d < minDt) minDt = d;
    if (d > lim) { w[i] = med; semReg += d - med; nPausas++; } else w[i] = d;
  }
  if (n) w[n - 1] = med;
  return { w, med, lim, maxDt, minDt: isFinite(minDt) ? minDt : med, semRegS: semReg, nPausas };
}

function resumir(series) {
  const { t, fc } = series, n = t.length;
  const P = pesos(t);
  let soma = 0, peso = 0, max = -Infinity, min = Infinity, tMax = 0;
  const h = new Map();
  for (let i = 0; i < n; i++) {
    const v = fc[i]; if (v == null) continue;
    soma += v * P.w[i]; peso += P.w[i];
    if (v > max) { max = v; tMax = t[i]; }
    if (v < min) min = v;
    h.set(v, (h.get(v) || 0) + P.w[i]);
  }
  let hist = null, fcMediana = null;
  if (peso) {
    const s = new Array(max - min + 1).fill(0);
    for (const [b, x] of h) s[b - min] = x;
    let acc = 0;
    for (let i = 0; i < s.length; i++) { acc += s[i]; if (acc >= peso / 2) { fcMediana = min + i; break; } }
    hist = { de: min, s: s.map(x => Math.round(x * 10) / 10) };
  }
  const canais = {};
  for (const k of ['fc', 'alt', 'dist', 'vel', 'cad', 'pot', 'temp']) {
    const a = series[k]; if (!a) continue;
    let c = 0, mn = Infinity, mx = -Infinity, sm = 0;
    for (const v of a) if (v != null) { c++; if (v < mn) mn = v; if (v > mx) mx = v; sm += v; }
    if (c) canais[k] = { n: c, min: mn, max: mx, media: sm / c };
  }
  if (series.alt) {
    const s = suavizar(t, series.alt, 30); let sobe = 0, desce = 0, ant = null;
    for (const v of s) { if (v == null) continue; if (ant != null) { const d = v - ant; if (d > 0) sobe += d; else desce -= d; } ant = v; }
    canais.alt.subida = sobe; canais.alt.descida = desce;
  }
  if (series.lat) canais.gps = { n: series.lat.filter(v => v != null).length };
  return {
    duracaoS: n ? t[n - 1] : 0, tempoFcS: Math.round(peso), fcMed: peso ? soma / peso : null, fcMax: peso ? max : null, fcMin: peso ? min : null,
    fcMediana, tFcMax: tMax, nRegistros: n, intervaloS: P.med, intervaloMinS: P.minDt, intervaloMaxS: P.maxDt, semRegistroS: P.semRegS, nPausas: P.nPausas, canais, hist
  };
}

function montarTreino(ativ, nomeArquivo) {
  const pts = ativ.pontos.filter(p => isFinite(p.ms)).sort((a, b) => a.ms - b.ms);
  if (pts.length < 2) throw new Error('o arquivo tem poucos registros para analisar');
  const t0 = pts[0].ms, t = [], c = {};
  CANAIS.forEach(k => { c[k] = []; });
  let ult = -1;
  for (const p of pts) {
    const s = Math.round((p.ms - t0) / 1000);
    if (s === ult) {
      const i = t.length - 1;
      for (const k of CANAIS) if (c[k][i] == null && p[k] != null && isFinite(p[k])) c[k][i] = p[k];
      continue;
    }
    t.push(s);
    for (const k of CANAIS) c[k].push(p[k] != null && isFinite(p[k]) ? p[k] : null);
    ult = s;
  }
  c.fc = c.fc.map(v => v != null && v >= 25 && v <= 250 ? Math.round(v) : null);
  if (!c.dist.some(v => v != null) && c.lat.some(v => v != null)) {
    let acc = 0, la0 = null, lo0 = null;
    c.dist = c.lat.map((la, i) => { const lo = c.lon[i]; if (la == null || lo == null) return null; if (la0 != null) acc += haversine(la0, lo0, la, lo); la0 = la; lo0 = lo; return acc; });
  }
  const R = { alt: 10, dist: 10, vel: 100, cad: 1, pot: 1, temp: 10, lat: 1e6, lon: 1e6 };
  const series = { t };
  for (const k of CANAIS) {
    if (!c[k].some(v => v != null)) continue;
    series[k] = k === 'fc' ? c[k] : c[k].map(v => v == null ? null : Math.round(v * R[k]) / R[k]);
  }
  if (!series.fc || series.fc.filter(v => v != null).length < 2) throw new Error('não encontrei registros de frequência cardíaca no arquivo');
  const resumo = resumir(series);
  const voltas = (ativ.voltas || []).map(v => ({ ...v, extras: v.extras || {} }));
  const soma = k => { const v = voltas.map(x => x[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
  const maxV = k => { const v = voltas.map(x => x[k]).filter(x => x != null); return v.length ? Math.max(...v) : null; };
  const tot = ativ.totais || {};
  const distSerie = series.dist ? (series.dist.filter(v => v != null).pop() - series.dist.find(v => v != null)) : null;
  const totais = {
    tempoS: tot.tempoS ?? soma('tempoS'), tempoAtivoS: tot.tempoAtivoS ?? null,
    distanciaM: tot.distanciaM ?? soma('distanciaM') ?? distSerie, calorias: tot.calorias ?? soma('calorias'),
    fcMed: tot.fcMed ?? (voltas.length === 1 ? voltas[0].fcMed : null), fcMax: tot.fcMax ?? maxV('fcMax'),
    velMed: tot.velMed ?? null, velMax: tot.velMax ?? maxV('velMax'), cadMed: tot.cadMed ?? null, potMed: tot.potMed ?? null,
    subidaM: tot.subidaM ?? null, descidaM: tot.descidaM ?? null
  };
  const fusoMin = ativ.fusoMin ?? fusoLocal(t0);
  const meta = {
    id: 't' + t0, v: 1, inicioMs: t0, fusoMin, formato: ativ.formato, arquivo: nomeArquivo || null,
    dispositivo: ativ.dispositivo || null, esporteArquivo: ativ.esporte || null, nomeArquivo: ativ.nome || null, notasArquivo: ativ.notas || null,
    dataAproximada: !!ativ.dataAproximada, tipo: tipoDoEsporte(ativ.esporte) || E.cfg.ultimoTipo || 'Treino',
    titulo: '', pse: null, rounds: null, notas: '', voltas, totais, resumo, importadoEm: new Date().toISOString()
  };
  return { meta: limpo(meta), series: limpo({ id: meta.id, ...series }) };
}

function suavizar(t, v, janela) {
  const n = t.length;
  if (!janela) return v.slice();
  const out = new Array(n), h = janela / 2;
  let a = 0, b = 0, soma = 0, cont = 0;
  for (let i = 0; i < n; i++) {
    while (b < n && t[b] <= t[i] + h) { if (v[b] != null) { soma += v[b]; cont++; } b++; }
    while (a < b && t[a] < t[i] - h) { if (v[a] != null) { soma -= v[a]; cont--; } a++; }
    out[i] = cont ? soma / cont : null;
  }
  return out;
}

function zonaDe(b, lim) { let z = 0; for (let i = 0; i < 5; i++) if (b >= lim[i]) z = i + 1; return z; }
function temposZona(hist, lim) {
  const z = [0, 0, 0, 0, 0, 0];
  if (!hist) return z;
  hist.s.forEach((s, i) => { z[zonaDe(hist.de + i, lim)] += s; });
  return z;
}
const cargaZonas = zt => zt.reduce((a, s, i) => a + s / 60 * i, 0);

function blocosEsforco(series, P, limiar) {
  const { t, fc } = series, n = t.length;
  const s20 = suavizar(t, fc, 20);
  const corr = [];
  let ini = null;
  for (let i = 0; i < n; i++) {
    const acima = s20[i] != null && s20[i] >= limiar;
    if (acima && ini == null) ini = i;
    if (!acima && ini != null) { corr.push([ini, i - 1]); ini = null; }
  }
  if (ini != null) corr.push([ini, n - 1]);
  const unidos = [];
  for (const r of corr) { const ant = unidos[unidos.length - 1]; if (ant && t[r[0]] - t[ant[1]] < 45) ant[1] = r[1]; else unidos.push(r.slice()); }
  const s10 = suavizar(t, fc, 10);
  return unidos.filter(([a, b]) => t[b] - t[a] >= 60).map(([a, b]) => {
    let soma = 0, peso = 0, max = -Infinity, iMax = a;
    for (let i = a; i <= b; i++) { const v = fc[i]; if (v == null) continue; soma += v * P.w[i]; peso += P.w[i]; if (v > max) { max = v; iMax = i; } }
    return { ini: t[a], fim: t[b], dur: t[b] - t[a], fcMed: peso ? soma / peso : null, fcMax: max, tMax: t[iMax], rec: quedaApos(series, iMax, s10) };
  });
}
function quedaApos(series, iPico, s10) {
  const { t, fc } = series, alvo = t[iPico] + 60;
  const j = primeiroMaiorIgual(t, alvo);
  if (j < 0 || t[j] - alvo > 15 || s10[j] == null) return null;
  return { de: fc[iPico], para: Math.round(s10[j]), queda: Math.round(fc[iPico] - s10[j]) };
}
function parciais(series, P, tam) {
  const { t, fc } = series, grupos = new Map();
  for (let i = 0; i < t.length; i++) {
    const v = fc[i]; if (v == null) continue;
    const k = Math.floor(t[i] / tam);
    let g = grupos.get(k); if (!g) grupos.set(k, g = { k, soma: 0, peso: 0, max: -Infinity, min: Infinity });
    g.soma += v * P.w[i]; g.peso += P.w[i]; if (v > g.max) g.max = v; if (v < g.min) g.min = v;
  }
  return [...grupos.values()].sort((a, b) => a.k - b.k).map(g => ({ ini: g.k * tam, fim: Math.min((g.k + 1) * tam, t[t.length - 1]), med: g.soma / g.peso, max: g.max, min: g.min }));
}
function mediaEntre(series, P, a, b) {

  for (let i = 0; i < series.t.length; i++) { const x = series.t[i]; if (x < a || x >= b) continue; const v = series.fc[i]; if (v == null) continue; soma += v * P.w[i]; peso += P.w[i]; }
  return peso ? soma / peso : null;
}

function analisar(meta, series, Z) {
  const P = pesos(series.t);
  const zt = temposZona(meta.resumo.hist, Z.limites);
  const limiar = limiarEsforco(Z);
  const blocos = blocosEsforco(series, P, limiar);
  const s10 = suavizar(series.t, series.fc, 10);

    P, zt, totalZ: zt.reduce((a, b) => a + b, 0), carga: cargaZonas(zt), altaS: zt[4] + zt[5], limiar, blocos,
    recPico: iPico >= 0 ? quedaApos(series, iPico, s10) : null,
    metades: [mediaEntre(series, P, 0, dur / 2), mediaEntre(series, P, dur / 2, dur + 1)]

}

function idbAbrir() {

}

function caberNoDoc(s, limite = 230000) {
  if (JSON.stringify(s).length <= limite) return s;
  for (let k = 2; k <= 64; k *= 2) {
    const d = { id: s.id };
    for (const [ch, arr] of Object.entries(s)) if (Array.isArray(arr)) d[ch] = arr.filter((_, i) => i % k === 0 || i === arr.length - 1);
    if (JSON.stringify(d).length <= limite) return d;

}

async function importarArquivos(lista) {

  let novos = 0, repetidos = 0, ultimo = null;
  const erros = [];
  for (const f of arquivos) {
    try {
      const buf = await f.arrayBuffer();

      if (fmt === 'JSON') { const r = await importarBackup(new TextDecoder().decode(buf)); novos += r.novos; repetidos += r.repetidos; ultimo = r.ultimo || ultimo; continue; }

      const ativs = fmt === 'FIT' ? parseFIT(buf) : fmt === 'TCX' ? parseTCX(txt) : fmt === 'GPX' ? parseGPX(txt) : parseCSV(txt, f);

  if (repetidos) partes.push(repetidos === 1 ? 'Esse treino já estava no histórico.' : `${repetidos} treinos já estavam no histórico.`);
  if (erros.length) partes.push('Não consegui ler ' + erros.join('; '));

}
async function importarBackup(txt) {

    preencherDica(dica, o.dica(i)); dica.hidden = false;
    const cx = m.l + banda * i + banda / 2, dw = dica.offsetWidth;
    let left = cx + banda / 2 + 6; if (left + dw > W - 2) left = cx - banda / 2 - 6 - dw;
    dica.style.left = Math.max(0, left) + 'px'; dica.style.top = (m.t + 4) + 'px';
  });
  svg.addEventListener('pointerleave', () => { dica.hidden = true; });
  if (o.aoClicar) svg.addEventListener('click', ev => { const r = ev.target.closest('.r-coluna'); if (r) o.aoClicar(+r.dataset.i); });
}

// barras horizontais empilhadas por zona (uma linha por treino)
function pilhaZonas(zt, total, dicaPrefixo) {
  return zt.map((v, z) => v > 0 ? `<span class="seg" style="flex:${v.toFixed(1)} 1 0;background:${corZona(z)}" data-dica="${esc(`${dicaPrefixo ? dicaPrefixo + '\n' : ''}${rotZona(z)}\n${fmtMin(v)} · ${fmtPct(v / total)}`)}"></span>` : '').join('');
}
function linhasPilhas(linhas, modo) {
  const maxTot = Math.max(1, ...linhas.map(l => l.total));
  return `<div class="pilhas">${linhas.map(l => {
    const larg = modo === 'pct' ? 100 : Math.max(2, l.total / maxTot * 100);
    const val = modo === 'pct' ? `${fmtPct(l.alta / (l.total || 1))} em Z4–Z5` : durCurta(l.total);
    return `<div class="pl"><button class="pl-rot" data-abrir="${esc(l.id)}">${l.cor ? `<i style="background:${l.cor}"></i>` : ''}<span>${esc(l.rotulo)}<small>${esc(l.sub)}</small></span></button>
      <div class="pilha" style="width:${larg.toFixed(1)}%" role="img" aria-label="${esc(l.rotulo + ': ' + l.zt.map((v, z) => `${rotZona(z)} ${fmtMin(v)}`).join(', '))}">${pilhaZonas(l.zt, l.total, l.rotulo)}</div>
      <span class="pl-val">${esc(val)}</span></div>`;
  }).join('')}</div>`;
}
function legendaZonas(Z, comAbaixo = true) {
  return `<div class="legenda">${[0, 1, 2, 3, 4, 5].filter(z => z > 0 || comAbaixo).map(z => `<span><i style="background:${corZona(z)}"></i>${z ? 'Z' + z : 'Abaixo'} <span class="nota">${esc(faixaZona(z, Z.limites).replace(' bpm', ''))}</span></span>`).join('')}</div>`;
}

// ================= vistas =================
function rotuloTreino(m) { return `${fmtData(m.inicioMs, m.fusoMin)} · ${m.tipo}${m.titulo ? ' · ' + m.titulo : ''}`; }
const durCurta = s => { const m = Math.round((s || 0) / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${p2(m % 60)}`; };
const stat = (valor, rot) => `<div class="stat"><b>${esc(valor)}</b><span>${esc(rot)}</span></div>`;
// seção recolhível; lembra quais estavam abertas entre uma renderização e outra
const abertos = new Set();
const secao = (chave, titulo, sub, conteudo) => `<details data-secao="${chave}"${abertos.has(chave) ? ' open' : ''}><summary><span>${esc(titulo)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></summary><div class="conteudo">${conteudo}</div></details>`;
function ligarSecoes(raiz) { $$('details[data-secao]', raiz).forEach(d => d.addEventListener('toggle', () => { if (d.open) abertos.add(d.dataset.secao); else abertos.delete(d.dataset.secao); })); }

async function renderTreino() {

  const subAnot = [meta.pse != null ? `PSE ${meta.pse}` : null, meta.rounds ? `${meta.rounds} rounds` : null, meta.notas ? 'com notas' : null].filter(Boolean).join(' · ');

  if (demo) return;
  const salvar = debounce(async () => {
    const st = $('#n-status');
    const pse = $('#n-pse').value, rounds = $('#n-rounds').value;
    const patch = { tipo: $('#n-tipo').value.trim() || 'Treino', titulo: $('#n-titulo').value.trim(), pse: pse === '' ? null : +pse, rounds: rounds === '' ? null : clamp(Math.round(+rounds), 0, 99), notas: $('#n-notas').value };
    Object.assign(meta, patch);
    try { await Armazem.atualizar(meta.id, patch); if (st) st.textContent = 'Salvo.'; } catch (e) { if (st) st.textContent = 'Não foi salvo.'; toast('Não consegui salvar as anotações: ' + (e.message || e.code || 'erro')); }
    if (patch.tipo !== E.cfg.ultimoTipo) { E.cfg.ultimoTipo = patch.tipo; salvarConfig(); }
  }, 700);
  for (const id of ['n-tipo', 'n-titulo', 'n-pse', 'n-rounds', 'n-notas']) $('#' + id).addEventListener(id === 'n-pse' ? 'change' : 'input', () => { $('#n-status').textContent = 'Salvando…'; salvar(); });

  const nao = $('#excluir-nao'); if (nao) nao.addEventListener('click', () => { E.confirmarExclusao = false; renderTreino(); });
  const sim = $('#excluir-sim'); if (sim) sim.addEventListener('click', () => excluirTreino(meta.id));
}
function ligarSeletor() {
  const sel = $('#t-sel'); if (!sel) return;
  sel.addEventListener('change', () => abrirTreino(sel.value));
  const i = E.treinos.findIndex(t => t.id === E.atual);
  $('#t-ant').addEventListener('click', () => { if (E.treinos[i + 1]) abrirTreino(E.treinos[i + 1].id); });
  $('#t-prox').addEventListener('click', () => { if (E.treinos[i - 1]) abrirTreino(E.treinos[i - 1].id); });
}
function abrirTreino(id) { E.atual = id; E.confirmarExclusao = false; mostrarAba('treino'); window.scrollTo({ top: 0 }); }
async function excluirTreino(id) {
  try { await Armazem.excluir(id); } catch (e) { toast('Não consegui excluir: ' + (e.message || e.code || 'erro')); return; }
  E.treinos = E.treinos.filter(t => t.id !== id); E.series.delete(id);
  E.cmp = E.cmp.filter(x => x !== id); E.corCmp.delete(id);
  E.confirmarExclusao = false; E.atual = E.treinos[0]?.id || null;
  toast('Treino excluído.'); renderTreino();
}

function cartaoArquivo(meta) {
  const r = meta.resumo, tot = meta.totais || {}, d = meta.dispositivo;
  const fim = meta.inicioMs + r.duracaoS * 1000;
  const disp = d ? [d.nome, d.versao ? `versão ${d.versao}` : null, d.produto && d.produto !== '0' ? `produto ${d.produto}` : null].filter(Boolean).join(' · ') : null;
  const tr = { Active: 'Ativa', Resting: 'Repouso', Manual: 'Manual', Distance: 'Por distância', Location: 'Por local', Time: 'Por tempo', HeartRate: 'Por FC' };
  const linhas = [
    ['Formato', meta.formato], ['Aparelho', disp], ['Arquivo', meta.arquivo], ['Esporte no arquivo', meta.esporteArquivo], ['Nome no arquivo', meta.nomeArquivo],
    ['Início e fim', `${fmtData(meta.inicioMs, meta.fusoMin)}, ${fmtHora(meta.inicioMs, meta.fusoMin)}–${fmtHora(fim, meta.fusoMin)} (${fmtFuso(meta.fusoMin)})${meta.dataAproximada ? ' · horário aproximado' : ''}`],
    ['Duração registrada', tot.tempoS != null ? `${fmtRelogio(tot.tempoS)} (${fmtN(tot.tempoS, 1)} s)` : fmtRelogio(r.duracaoS)],
    ['Tempo em movimento', tot.tempoAtivoS != null ? fmtRelogio(tot.tempoAtivoS) : null],
    ['Calorias (aparelho)', tot.calorias != null ? `${fmtN(tot.calorias)} kcal` : null],
    ['Distância', tot.distanciaM != null ? `${fmtN(tot.distanciaM)} m` : null],
    ['FC média e máx. (aparelho)', tot.fcMed != null || tot.fcMax != null ? `${tot.fcMed ?? '–'} / ${tot.fcMax ?? '–'} bpm` : null],

function desenharMapa(el, series) {
  montar(el, () => {
    const W = Math.max(240, el.clientWidth || 400), H = Math.round(W * 0.65); el._w = el.clientWidth;
    const la = series.lat, lo = series.lon, pts = [];
    for (let i = 0; i < la.length; i++) if (la[i] != null && lo[i] != null) pts.push([lo[i], la[i]]);
    if (pts.length < 2) { el.innerHTML = '<p class="nota">Sem pontos de GPS suficientes.</p>'; return; }
    const lats = pts.map(p => p[1]), lons = pts.map(p => p[0]);
    const k = Math.cos((Math.min(...lats) + Math.max(...lats)) / 2 * Math.PI / 180);
    const x0 = Math.min(...lons), x1 = Math.max(...lons), y0 = Math.min(...lats), y1 = Math.max(...lats);
    const sx = (x1 - x0) * k || 1e-6, sy = (y1 - y0) || 1e-6, e = Math.min((W - 24) / sx, (H - 24) / sy);
    const ox = (W - sx * e) / 2, oy = (H - sy * e) / 2;
    const P = ([x, y]) => [ox + (x - x0) * k * e, H - oy - (y - y0) * e];
    const d = pts.map((p, i) => (i ? 'L' : 'M') + P(p).map(v => v.toFixed(1)).join(' ')).join('');
    const [ax, ay] = P(pts[0]), [bx, by] = P(pts[pts.length - 1]);
    el.innerHTML = `<svg class="svg-graf" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Percurso registrado pelo GPS"><rect width="${W}" height="${H}" rx="10" style="fill:var(--surface-2)"/><path d="${d}" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><circle cx="${ax}" cy="${ay}" r="5" style="fill:var(--good);stroke:var(--surface);stroke-width:2"/><circle cx="${bx}" cy="${by}" r="5" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/></svg><p class="nota">Verde: início · escuro: fim.</p>`;
  });
}

    <section class="card mais">${secao('refs', 'De onde vêm os cálculos', '', `<ul class="refs">

        <li>Zonas pela FC de reserva: Karvonen MJ, Kentala E, Mustala O. The effects of training on heart rate; a longitudinal study. Ann Med Exp Biol Fenn. 1957;35(3):307-15.</li>
        <li>Carga pela PSE da sessão: Foster C, Florhaug JA, Franklin J, et al. A new approach to monitoring exercise training. J Strength Cond Res. 2001;15(1):109-15.</li>
        <li>Precisão de sensores de pulso: Wang R, Blackburn G, Desai M, et al. Accuracy of wrist-worn heart rate monitors. JAMA Cardiol. 2017;2(1):104-6.</li></ul>
      <p class="nota">A estimativa pela idade erra vários bpm de pessoa para pessoa; um teste de esforço dá o valor real. A carga por zonas soma os minutos de cada zona multiplicados pelo número da zona.</p>`)}</section>`;
  ligarSecoes(raiz);
  $('#z-met').value = metodo;
  const st = () => { const s = $('#z-status'); if (s) s.textContent = 'Salvo'; };
  const reaplicar = () => { const Zn = zonasAtuais(); $$('[data-faixa]', raiz).forEach(td => { td.textContent = faixaZona(+td.dataset.faixa, Zn.limites); }); salvarConfig(); st(); };
  const num = (el, a, b) => { const v = el.value === '' ? null : Math.round(+el.value); return v != null && v >= a && v <= b ? v : null; };
  const atualizarInfo = () => { const i = $('#z-info'); if (i) i.firstChild.textContent = textoFcmax(zonasAtuais()); };
  $('#z-idade').addEventListener('input', e => { E.cfg.idade = num(e.target, 10, 100); reaplicar(); atualizarInfo(); });
  $('#z-fcmax').addEventListener('input', e => { E.cfg.fcmax = num(e.target, 120, 230); reaplicar(); atualizarInfo(); });

  $('#z-met').addEventListener('change', e => {
    if (e.target.value === 'manual' && !(Array.isArray(E.cfg.limites) && E.cfg.limites.length === 5)) E.cfg.limites = zonasAtuais().limites;
    E.cfg.metodo = e.target.value; salvarConfig(); renderAjustes(); st();
  });
  $$('[data-pct]', raiz).forEach(inp => inp.addEventListener('input', () => { const v = num(inp, 30, 100); if (v == null) return; E.cfg.pcts = (E.cfg.pcts || PCTS_PADRAO).slice(); E.cfg.pcts[+inp.dataset.pct] = v; reaplicar(); }));
  $$('[data-lim]', raiz).forEach(inp => inp.addEventListener('input', () => { const v = num(inp, 40, 230); if (v == null) return; E.cfg.limites = (E.cfg.limites || zonasAtuais().limites).slice(); E.cfg.limites[+inp.dataset.lim] = v; reaplicar(); }));
  $('#z-padrao').addEventListener('click', () => { E.cfg.pcts = PCTS_PADRAO.slice(); E.cfg.limites = null; if (E.cfg.metodo === 'manual') E.cfg.metodo = 'fcmax'; salvarConfig(); renderAjustes(); st(); });
  const ap = $('#b-apagar'); if (ap) ap.addEventListener('click', () => { E.confirmarApagar = true; renderAjustes(); });
  const apN = $('#b-apagar-nao'); if (apN) apN.addEventListener('click', () => { E.confirmarApagar = false; renderAjustes(); });
  const apS = $('#b-apagar-sim'); if (apS) apS.addEventListener('click', async () => {
    try { for (const t of E.treinos.slice()) { await Armazem.excluir(t.id); E.treinos = E.treinos.filter(x => x.id !== t.id); } } catch (e) { toast('Parte dos treinos não foi apagada: ' + (e.message || e.code || 'erro')); }
    E.series.clear(); E.cmp = []; E.corCmp.clear(); E.atual = null; E.confirmarApagar = false;
    toast('Histórico apagado.'); renderAjustes();
  });
}

// backup: um arquivo .json com treinos, séries, anotações e zonas
async function fazerBackup(enviar) {
  if (!E.treinos.length) { toast('Ainda não há treinos para o backup.'); return; }
  const treinos = [];
  for (const m of E.treinos) treinos.push({ meta: m, series: await obterSerie(m.id) });
  const hoje = new Date();
  const nome = `pulso-do-treino-backup-${hoje.getFullYear()}-${p2(hoje.getMonth() + 1)}-${p2(hoje.getDate())}.json`;
  const json = JSON.stringify({ app: 'pulso-do-treino', versao: 1, exportadoEm: hoje.toISOString(), config: E.cfg, treinos });
  const ok = enviar ? await enviarArquivo(nome, json) : await salvarArquivo(nome, json);
  if (!ok) return;
  E.cfg.ultimoBackup = Date.now(); salvarConfig();
  if (E.aba === 'ajustes') renderAjustes(); else if (E.aba === 'historico') renderHistorico();
}
function podeCompartilhar() {
  try { return ehSite() && !!navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'teste.json', { type: 'application/json' })] }); } catch (e) { return false; }
}
async function enviarArquivo(nome, conteudo) {
  try { await navigator.share({ files: [new File([conteudo], nome, { type: 'application/json' })], title: 'Backup do Pulso do Treino' }); toast('Backup enviado.'); return true; }
  catch (e) { if (e && e.name !== 'AbortError') toast('Não consegui enviar. Use "Fazer backup" para salvar o arquivo.'); return false; }
}

// ================= imagem do treino para compartilhar =================
// Desenhada num canvas em resolução de rede social (1080 px de largura), como os cartões do Strava e do Samsung Health.
const FORMATOS = { stories: { nome: 'Stories', w: 1080, h: 1920 }, feed: { nome: 'Feed', w: 1080, h: 1350 }, quadrado: { nome: 'Quadrado', w: 1080, h: 1080 } };
const FUNDOS = { escuro: 'Escuro', claro: 'Claro', foto: 'Foto', transparente: 'Sem fundo' };
const PALETA_IMG = {
  escuro: { fundo: '#14181F', tinta: '#F2EEE6', suave: '#AEB5C0', acento: '#F28C4A', trilho: 'rgba(255,255,255,.12)', zonas: ['#5A616C', '#F2B582', '#EE9255', '#E1702F', '#BE5020', '#A23C16'] },
  claro: { fundo: '#F2EEE6', tinta: '#14181F', suave: '#5F646C', acento: '#B9470F', trilho: 'rgba(20,24,31,.10)', zonas: ['#C9C3B6', '#E0A25E', '#DA8142', '#C9612A', '#A8461C', '#7E2D12'] }
};
const cartao = { foto: null };
const fonteImg = (peso, t) => `${peso} ${t}px "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
const semAcento = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'treino';

function retArred(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// escreve e diminui a fonte até caber na largura
function escrever(ctx, txt, x, y, maxW, tam, peso, cor, alinhar = 'left') {
  let t = tam;
  ctx.font = fonteImg(peso, t);
  while (maxW && ctx.measureText(txt).width > maxW && t > 16) { t -= 2; ctx.font = fonteImg(peso, t); }
  ctx.fillStyle = cor; ctx.textAlign = alinhar; ctx.textBaseline = 'alphabetic';
  ctx.fillText(txt, x, y);
  return ctx.measureText(txt).width;
}

async function desenharCartao(cv, meta, series) {
  const F = FORMATOS[E.cfg.cartaoFormato] || FORMATOS.stories, W = F.w, H = F.h, pad = 72;
  const fundo = E.cfg.cartaoFundo === 'foto' && !cartao.foto ? 'escuro' : (E.cfg.cartaoFundo || 'escuro');
  const semFundo = fundo === 'transparente', comFoto = fundo === 'foto';
  const P = fundo === 'claro' ? PALETA_IMG.claro : semFundo || comFoto ? { ...PALETA_IMG.escuro, suave: '#E1E5EB' } : PALETA_IMG.escuro;
  try { await Promise.all([document.fonts.load(fonteImg(700, 80)), document.fonts.load(fonteImg(400, 30)), document.fonts.load(fonteImg(600, 30))]); } catch (e) { /* usa a fonte do sistema */ }
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const Z = zonasAtuais(), r = meta.resumo, tot = meta.totais || {};
  const zt = temposZona(r.hist, Z.limites), totalZ = zt.reduce((a, b) => a + b, 0) || 1;
  const formato = E.cfg.cartaoFormato || 'stories';
  const compacto = formato !== 'stories' || comFoto || semFundo;
  const altGraf = comFoto ? { stories: 300, feed: 220, quadrado: 150 }[formato] : { stories: 400, feed: 300, quadrado: 220 }[formato];
  const gap = formato === 'stories' && !compacto ? 60 : 42;
  const altZonas = compacto ? 172 : 44 + 5 * 64;
  const blocos = [50, gap, 150, gap, 132, gap + 6, altGraf, gap + 6, altZonas];
  const total = blocos.reduce((a, b) => a + b, 0);
  const y0 = comFoto ? H - pad - total : Math.max(pad, (H - total) / 2);

  // fundo
  ctx.clearRect(0, 0, W, H);
  if (comFoto) {
    const img = cartao.foto, e = Math.max(W / img.width, H / img.height), iw = img.width * e, ih = img.height * e;
    ctx.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(12,14,18,.10)'); g.addColorStop(clamp((y0 - 260) / H, 0, 1), 'rgba(12,14,18,.18)');
    g.addColorStop(clamp((y0 + 80) / H, 0, 1), 'rgba(12,14,18,.78)'); g.addColorStop(1, 'rgba(12,14,18,.92)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else if (!semFundo) {
    ctx.fillStyle = P.fundo; ctx.fillRect(0, 0, W, H);
    const brilho = ctx.createRadialGradient(W * 0.85, H * 0.08, 0, W * 0.85, H * 0.08, W * 0.9);
    brilho.addColorStop(0, fundo === 'claro' ? 'rgba(242,140,74,.16)' : 'rgba(242,140,74,.14)'); brilho.addColorStop(1, 'rgba(242,140,74,0)');
    ctx.fillStyle = brilho; ctx.fillRect(0, 0, W, H);
  }
  // sem fundo ou sobre foto, uma sombra leve mantém o texto legível
  const sombra = (on) => { ctx.shadowColor = on && (semFundo || comFoto) ? 'rgba(0,0,0,.45)' : 'transparent'; ctx.shadowBlur = on ? 14 : 0; ctx.shadowOffsetY = on ? 2 : 0; };
  sombra(true);
  let y = y0;

  // marca
  const mx = pad, my = y + 6, esc_ = 52 / 384;
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = PALETA_IMG.escuro.acento;
  ctx.beginPath();
  [[64, 292], [168, 292], [204, 226], [246, 350], [292, 118], [336, 292], [448, 292]].forEach(([px, py], i) => { const X = mx + (px - 64) * esc_, Y = my + (py - 118) * esc_; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
  ctx.stroke();
  ctx.fillStyle = P.tinta; ctx.beginPath(); ctx.arc(mx + (292 - 64) * esc_, my, 5, 0, Math.PI * 2); ctx.fill();
  ctx.font = fonteImg(700, 26); ctx.fillStyle = P.suave; ctx.textAlign = 'left';
  try { ctx.letterSpacing = '4px'; } catch (e) { /* sem espaçamento */ }
  ctx.fillText('PULSO DO TREINO', mx + 66, y + 38);
  try { ctx.letterSpacing = '0px'; } catch (e) { /* sem espaçamento */ }
  y += blocos[0] + blocos[1];

  // título e data
  const fim = meta.inicioMs + r.duracaoS * 1000;
  escrever(ctx, meta.tipo || 'Treino', pad, y + 92, W - 2 * pad, 96, 700, P.tinta);
  const sub = `${meta.titulo ? meta.titulo + ' · ' : ''}${fmtDiaSemana(meta.inicioMs, meta.fusoMin)}, ${fmtData(meta.inicioMs, meta.fusoMin)} · ${fmtHora(meta.inicioMs, meta.fusoMin)}–${fmtHora(fim, meta.fusoMin)}`;
  escrever(ctx, sub, pad, y + 142, W - 2 * pad, 34, 400, P.suave);
  y += blocos[2] + blocos[3];

  // números
  const dist = tot.distanciaM > 0 ? tot.distanciaM : null;
  const quarto = tot.calorias != null ? [fmtN(tot.calorias), '', 'kcal'] : dist ? [fmtN(dist / 1000, 1), 'km', 'distância'] : [fmtN(r.fcMin), 'bpm', 'FC mín.'];
  const nums = [[durCurta(r.duracaoS), '', 'duração'], [fmtN(r.fcMed), 'bpm', 'FC média'], [fmtN(r.fcMax), 'bpm', 'FC máx.', true], quarto];
  const colW = (W - 2 * pad) / 4;
  nums.forEach(([v, un, rot, destaque], i) => {
    const x = pad + i * colW;
    const wv = escrever(ctx, v, x, y + 78, colW - 12, 80, 700, destaque ? P.acento : P.tinta);
    if (un && wv + 70 < colW) escrever(ctx, un, x + wv + 8, y + 78, 0, 28, 600, P.suave);
    escrever(ctx, rot, x, y + 122, colW - 12, 28, 400, P.suave);
  });
  y += blocos[4] + blocos[5];

  // gráfico da FC, com a linha na cor da zona
  const gx0 = pad, gx1 = W - pad, gy0 = y, gy1 = y + altGraf - 40;
  const s30 = suavizar(series.t, series.fc, 30), dur = series.t[series.t.length - 1] || 1;
  const passo = Math.max(1, Math.floor(series.t.length / 320)), pts = [];
  for (let i = 0; i < series.t.length; i += passo) if (s30[i] != null) pts.push([series.t[i], s30[i]]);
  let vmin = Math.min(...pts.map(p => p[1])), vmax = Math.max(r.fcMax, ...pts.map(p => p[1]));
  vmin -= 6; vmax += 10;
  const GX = t => gx0 + t / dur * (gx1 - gx0), GY = v => gy1 - (v - vmin) / (vmax - vmin) * (gy1 - gy0);
  sombra(false);
  const area = ctx.createLinearGradient(0, gy0, 0, gy1);
  area.addColorStop(0, fundo === 'claro' ? 'rgba(242,140,74,.30)' : 'rgba(242,140,74,.34)'); area.addColorStop(1, 'rgba(242,140,74,0)');
  ctx.beginPath(); ctx.moveTo(GX(pts[0][0]), gy1);
  for (const [t, v] of pts) ctx.lineTo(GX(t), GY(v));
  ctx.lineTo(GX(pts[pts.length - 1][0]), gy1); ctx.closePath(); ctx.fillStyle = area; ctx.fill();
  ctx.strokeStyle = P.trilho; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx0, gy1 + 1); ctx.lineTo(gx1, gy1 + 1); ctx.stroke();
  sombra(true);
  ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let zAtual = null;
  for (let i = 1; i < pts.length; i++) {
    const z = Math.max(1, zonaDe(Math.round((pts[i - 1][1] + pts[i][1]) / 2), Z.limites));
    if (z !== zAtual) { if (zAtual != null) ctx.stroke(); ctx.strokeStyle = P.zonas[z]; ctx.beginPath(); ctx.moveTo(GX(pts[i - 1][0]), GY(pts[i - 1][1])); zAtual = z; }
    ctx.lineTo(GX(pts[i][0]), GY(pts[i][1]));
  }
  ctx.stroke();
  // pico
  const px = GX(r.tFcMax), py = GY(r.fcMax);
  ctx.fillStyle = P.tinta; ctx.beginPath(); ctx.arc(px, py, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PALETA_IMG.escuro.acento; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
  ctx.font = fonteImg(700, 30);
  const rotPico = `máx. ${r.fcMax}`, wp = ctx.measureText(rotPico).width;
  escrever(ctx, rotPico, clamp(px, gx0 + wp / 2, gx1 - wp / 2), Math.max(gy0 - 8, py - 26), 0, 30, 700, P.tinta, 'center');
  escrever(ctx, '0 min', gx0, gy1 + 36, 0, 26, 400, P.suave, 'left');
  escrever(ctx, `${fmtN(dur / 60)} min`, gx1, gy1 + 36, 0, 26, 400, P.suave, 'right');
  y += blocos[6] + blocos[7];

  // tempo em cada zona
  escrever(ctx, 'Tempo nas zonas', pad, y + 30, 0, 30, 600, P.suave);
  if (compacto) {
    const by = y + 52, bh = 24, bw = W - 2 * pad;
    sombra(false);
    ctx.save(); retArred(ctx, pad, by, bw, bh, bh / 2); ctx.clip();
    let x = pad;
    const visiveis = zt.map((v, z) => [v, z]).filter(([v]) => v > 0);
    visiveis.forEach(([v, z], i) => { const w = v / totalZ * bw; ctx.fillStyle = P.zonas[z]; ctx.fillRect(x, by, Math.max(0, w - (i < visiveis.length - 1 ? 4 : 0)), bh); x += w; });
    ctx.restore();
    sombra(true);
    const cw = bw / 5;
    for (let z = 1; z <= 5; z++) {
      const cx = pad + (z - 1) * cw, cy = by + bh + 44;
      ctx.fillStyle = P.zonas[z]; retArred(ctx, cx, cy - 18, 18, 18, 4); ctx.fill();
      escrever(ctx, `Z${z}`, cx + 28, cy, 0, 28, 700, P.tinta);
      escrever(ctx, fmtMin(zt[z]), cx, cy + 42, cw - 10, 32, 700, P.tinta);
      escrever(ctx, fmtPct(zt[z] / totalZ), cx, cy + 76, cw - 10, 26, 400, P.suave);
    }
  } else {
    const maxZ = Math.max(1, ...zt.slice(1));
    for (let z = 1; z <= 5; z++) {
      const ry = y + 44 + (z - 1) * 64 + 40;
      ctx.fillStyle = P.zonas[z]; ctx.beginPath(); ctx.arc(pad + 10, ry - 11, 10, 0, Math.PI * 2); ctx.fill();
      escrever(ctx, `Z${z}`, pad + 32, ry, 0, 32, 700, P.tinta);
      escrever(ctx, NOMES_ZONA[z], pad + 92, ry, 170, 28, 400, P.suave);
      const pct = fmtPct(zt[z] / totalZ), mins = fmtMin(zt[z]);
      const wPct = escrever(ctx, pct, W - pad, ry, 0, 28, 400, P.suave, 'right');
      escrever(ctx, mins, W - pad - wPct - 14, ry, 0, 32, 700, P.tinta, 'right');
      const tx0 = pad + 280, tx1 = W - pad - 240;
      sombra(false);
      ctx.fillStyle = P.trilho; retArred(ctx, tx0, ry - 20, tx1 - tx0, 16, 8); ctx.fill();
      if (zt[z] > 0) { ctx.fillStyle = P.zonas[z]; retArred(ctx, tx0, ry - 20, Math.max(16, (tx1 - tx0) * zt[z] / maxZ), 16, 8); ctx.fill(); }
      sombra(true);
    }
  }
  sombra(false);
}

  $('#t-compartilhar')?.focus();
}
function teclaCartao(ev) { if (ev.key === 'Escape') fecharCartao(); }
async function carregarFoto(arquivo) {
  try { return await createImageBitmap(arquivo); }
  catch (e) {
    const url = URL.createObjectURL(arquivo), img = new Image();
    img.src = url; await img.decode(); return img;
  }
}
function abrirCartao(meta, series) {
  fecharCartao();
  if (!FORMATOS[E.cfg.cartaoFormato]) E.cfg.cartaoFormato = 'stories';
  if (!FUNDOS[E.cfg.cartaoFundo] || (E.cfg.cartaoFundo === 'foto' && !cartao.foto)) E.cfg.cartaoFundo = 'escuro';
  const enviar = podeCompartilharImagem();
  const el = document.createElement('div');
  el.className = 'folha-fundo'; el.id = 'cartao';
  el.innerHTML = `<div class="folha" role="dialog" aria-modal="true" aria-labelledby="cartao-tit">
    <div class="card-topo"><h2 id="cartao-tit">Compartilhar treino</h2><button class="btn btn-icone" id="cartao-fechar" aria-label="Fechar">×</button></div>
    <div class="previa" id="cartao-previa"><canvas id="cartao-cv" role="img" aria-label="Imagem do treino para compartilhar"></canvas></div>
    <div class="campo"><span>Formato</span><div class="segmentado" data-grupo="cartaoFormato">${Object.entries(FORMATOS).map(([k, f]) => `<button data-valor="${k}">${f.nome}</button>`).join('')}</div></div>
    <div class="campo"><span>Fundo</span><div class="segmentado" data-grupo="cartaoFundo">${Object.entries(FUNDOS).map(([k, n]) => `<button data-valor="${k}">${n}</button>`).join('')}</div></div>
    <input type="file" id="cartao-foto" accept="image/*" class="oculto-visual">
    <p class="nota" id="cartao-nota"></p>
    <div class="botoes">${enviar ? '<button class="btn btn-acento" id="cartao-enviar">Compartilhar</button>' : ''}<button class="btn${enviar ? '' : ' btn-acento'}" id="cartao-salvar">Salvar imagem</button></div></div>`;
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  const cv = $('#cartao-cv');
  const notas = { escuro: '', claro: '', foto: 'Toque em Foto de novo para trocar a imagem.', transparente: 'Imagem sem fundo, para colocar por cima de uma foto nos Stories.' };
  const atualizar = async () => {
    $$('.segmentado button', el).forEach(b => b.setAttribute('aria-pressed', String(E.cfg[b.parentElement.dataset.grupo] === b.dataset.valor)));
    $('#cartao-previa').classList.toggle('xadrez', E.cfg.cartaoFundo === 'transparente');
    $('#cartao-nota').textContent = notas[E.cfg.cartaoFundo] || '';
    await desenharCartao(cv, meta, series);
  };
  const gerar = () => new Promise(ok => {
    const jpg = E.cfg.cartaoFundo === 'foto';
    cv.toBlob(b => ok({ blob: b, ext: jpg ? 'jpg' : 'png', tipo: jpg ? 'image/jpeg' : 'image/png' }), jpg ? 'image/jpeg' : 'image/png', 0.92);
  });
  const nomeArq = ext => { const d = parede(meta.inicioMs, meta.fusoMin); return `pulso-${semAcento(meta.tipo)}-${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}.${ext}`; };
  el.addEventListener('click', ev => { if (ev.target === el) fecharCartao(); });
  document.addEventListener('keydown', teclaCartao);
  $('#cartao-fechar').addEventListener('click', fecharCartao);
  $$('.segmentado button', el).forEach(b => b.addEventListener('click', () => {
    const grupo = b.parentElement.dataset.grupo, valor = b.dataset.valor;
    if (grupo === 'cartaoFundo' && valor === 'foto' && (!cartao.foto || E.cfg.cartaoFundo === 'foto')) { $('#cartao-foto').click(); return; }
    E.cfg[grupo] = valor; salvarConfig(); atualizar();
  }));
  $('#cartao-foto').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { cartao.foto = await carregarFoto(f); E.cfg.cartaoFundo = 'foto'; salvarConfig(); atualizar(); }
    catch (err) { toast('Não consegui abrir essa foto. Tente outra imagem.'); }
  });
  const btE = $('#cartao-enviar');
  if (btE) btE.addEventListener('click', async () => {
    const { blob, ext, tipo } = await gerar();
    try { await navigator.share({ files: [new File([blob], nomeArq(ext), { type: tipo })], title: `${meta.tipo} · ${fmtData(meta.inicioMs, meta.fusoMin)}` }); }
    catch (err) { if (err && err.name !== 'AbortError') toast('Não consegui compartilhar. Use Salvar imagem.'); }
  });
  $('#cartao-salvar').addEventListener('click', async () => {
    const { blob, ext, tipo } = await gerar();
    await salvarArquivo(nomeArq(ext), blob, tipo, 'Imagem salva em Downloads.');
  });
  atualizar();
  $('#cartao-fechar').focus();
}

// ================= aplicativo instalável =================
let pedidoInstalacao = null;
const ehSite = () => /^https?:$/.test(location.protocol) && !!$('link[rel="manifest"]');
const instalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function comoApp() {
  if (!ehSite() || instalado()) return '';
  return `<section class="card"><h2>Usar como aplicativo</h2>
    <p class="texto">Instale para abrir pelo ícone, em tela cheia e sem internet. No Android: menu ⋮ › <b>Instalar app</b>. No iPhone: Compartilhar › <b>Adicionar à Tela de Início</b>.</p>
    ${pedidoInstalacao ? '<div class="botoes"><button class="btn btn-acento" data-instalar>Instalar agora</button></div>' : ''}</section>`;
}
async function instalar() {
  if (!pedidoInstalacao) return;
  const p = pedidoInstalacao; pedidoInstalacao = null; $('#instalar').hidden = true;
  p.prompt(); try { await p.userChoice; } catch (e) { /* recusado */ }
}
function ligarInstalacao() {
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); pedidoInstalacao = ev; $('#instalar').hidden = false; });
  window.addEventListener('appinstalled', () => { pedidoInstalacao = null; $('#instalar').hidden = true; toast('Pulso do Treino instalado. O ícone está na tela inicial.'); });
  $('#instalar').addEventListener('click', instalar);
  if (ehSite() && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* segue sem modo offline */ });
}

// ================= navegação e eventos =================
const ABAS = ['treino', 'historico', 'comparar', 'ajustes'];
function mostrarAba(aba) {
  E.aba = aba;
  $$('.aba').forEach(b => b.setAttribute('aria-selected', String(b.dataset.aba === aba)));
  for (const n of ABAS) $('#aba-' + n).hidden = n !== aba;
  if (E.carregando) return;
  ({ treino: renderTreino, historico: renderHistorico, comparar: renderComparar, ajustes: renderAjustes })[aba]();
}
let toastId;
function toast(msg, ms = 4500) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastId); toastId = setTimeout(() => { t.hidden = true; }, ms); }

function ligarEventos() {
  $$('.aba').forEach(b => b.addEventListener('click', () => { mostrarAba(b.dataset.aba); window.scrollTo({ top: 0 }); }));
  $('.abas').addEventListener('keydown', ev => {
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    const abas = $$('.aba'), i = abas.findIndex(b => b.dataset.aba === E.aba), j = (i + (ev.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    abas[j].focus(); mostrarAba(abas[j].dataset.aba);
  });
  $('#arquivo').addEventListener('change', e => { const f = e.target.files; importarArquivos(f).finally(() => { e.target.value = ''; }); });
  $('#restaurar').addEventListener('change', e => { const f = e.target.files; importarArquivos(f).finally(() => { e.target.value = ''; if (E.aba === 'ajustes') renderAjustes(); }); });
  document.addEventListener('click', ev => {
    const ir = ev.target.closest('[data-ir]'); if (ir) { mostrarAba(ir.dataset.ir); return; }
    if (ev.target.closest('[data-backup]')) { fazerBackup(false); return; }
    if (ev.target.closest('[data-backup-enviar]')) { fazerBackup(true); return; }
    if (ev.target.closest('[data-instalar]')) { instalar(); return; }
    const ab = ev.target.closest('[data-abrir]'); if (ab) abrirTreino(ab.dataset.abrir);
  });
  // arrastar e soltar
  const soltar = $('#soltar'); let prof = 0;
  const temArquivo = ev => [...(ev.dataTransfer?.types || [])].includes('Files');
  window.addEventListener('dragenter', ev => { if (!temArquivo(ev)) return; ev.preventDefault(); prof++; soltar.hidden = false; });
  window.addEventListener('dragover', ev => { if (temArquivo(ev)) ev.preventDefault(); });
  window.addEventListener('dragleave', () => { prof = Math.max(0, prof - 1); if (!prof) soltar.hidden = true; });
  window.addEventListener('drop', ev => { if (!temArquivo(ev)) return; ev.preventDefault(); prof = 0; soltar.hidden = true; importarArquivos(ev.dataTransfer.files); });
  // dica das barras empilhadas
  const dica = $('#dica');
  const posicionar = ev => { const w = dica.offsetWidth, h = dica.offsetHeight; let x = ev.clientX + 12, y = ev.clientY + 12; if (x + w > innerWidth - 8) x = ev.clientX - 12 - w; if (y + h > innerHeight - 8) y = ev.clientY - 12 - h; dica.style.left = Math.max(8, x) + 'px'; dica.style.top = Math.max(8, y) + 'px'; };
  document.addEventListener('pointerover', ev => { const el = ev.target.closest?.('[data-dica]'); if (!el) return; dica.textContent = el.dataset.dica; dica.hidden = false; posicionar(ev); });
  document.addEventListener('pointermove', ev => { if (!dica.hidden && ev.target.closest?.('[data-dica]')) posicionar(ev); });
  document.addEventListener('pointerout', ev => { if (ev.target.closest?.('[data-dica]')) dica.hidden = true; });
  window.addEventListener('scroll', () => { dica.hidden = true; }, { passive: true });
}

async function iniciar() {
  ligarEventos();
  ligarInstalacao();
  const h = (location.hash || '').slice(1);
  if (h === 'zonas') mostrarAba('ajustes'); else if (ABAS.includes(h)) mostrarAba(h);
  try {
    Armazem = await escolherArmazem();
    const cfg = await Armazem.config().catch(() => null);
    E.cfg = { ...CONFIG_PADRAO, ...(cfg || {}) };
    E.treinos = (await Armazem.listar()).filter(t => t && t.id && t.resumo);
  } catch (e) {
    Armazem = armazemMemoria();
    toast('Não consegui abrir o histórico salvo. Os treinos importados agora não serão guardados.', 8000);
  }
  ordenar();
  E.atual = E.treinos[0]?.id || null;
  E.carregando = false;
  mostrarAba(E.aba);
}
iniciar();
})();
</script>
